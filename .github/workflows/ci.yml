name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: enterprise_ai_test
      DB_USER: enterprise_ai_test
      DB_PASSWORD: ci-database-password
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: enterprise_ai_test
          POSTGRES_USER: enterprise_ai_test
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_ai_test -d enterprise_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ".[dev]"

      - name: Compile application
        run: python -m compileall -q app

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Lint
        run: python -m ruff check app tests evaluation alembic

      - name: Check formatting
        run: python -m ruff format --check app tests evaluation alembic

      - name: Run tests with coverage gate
        run: >-
          python -m pytest tests
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container validation
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-compose-password
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      MCP_ISSUER_URL: https://api.example.com
      MCP_RESOURCE_SERVER_URL: https://api.example.com/mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: enterprise-ai-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
