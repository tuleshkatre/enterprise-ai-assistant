[project]
name = "enterprise-ai-assistant"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "alembic==1.19.1",
    "bcrypt==4.1.2",
    "ddgs==9.15.0",
    "fastapi==0.141.1",
    "langchain==1.3.15",
    "langchain-community==0.4.2",
    "langchain-core==1.6.0",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.5.2",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.11",
    "langsmith==0.11.1",
    "mcp==2.0.0",
    "httpx2==2.12.0",
    "numexpr==2.14.2",
    "ollama==0.6.2",
    "openai==3.3.1",
    "pgvector==0.5.0",
    "pypdf==6.16.1",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "passlib==1.7.4",
    "python-dotenv==1.2.3",
    "python-jose==3.5.0",
    "python-multipart==0.0.32",
    "SQLAlchemy==2.0.52",
    "slowapi==0.1.10",
    "sse-starlette==3.4.8",
    "tiktoken==0.14.0",
    "torch==2.13.0",
    "truststore==0.10.4",
    "typer==0.27.1",
    "uvicorn==0.52.4",
    "prometheus-fastapi-instrumentator==8.1.0",
    "sentence-transformers==6.0.0",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]
evaluation = [
    "requests==2.34.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["venv", ".venv", "uploads", ".pytest_cache", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B904", "E402", "E501", "F403", "UP046"]
